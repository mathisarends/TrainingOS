[project]
name = "trainingos-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "pytest>=9", "pytest-asyncio>=1", "httpx>=0.28", "aiosqlite>=0.22"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
  "unit: deterministic framework-free domain or application tests",
  "integration: real application, database and resource lifetimes",
  "contract: HTTP and OpenAPI public contract",
  "postgres: PostgreSQL-specific locking or concurrency guarantee",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/src"]

